[project]
name = "ecomove-api"
version = "1.0.0"
description = "EcoMove Querétaro — Backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36,<2.2",
  "geoalchemy2>=0.16",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["B008"]  # Depends() en argumentos por defecto (patrón FastAPI)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/e2e los mantiene QA: caja negra contra una API en marcha (E2E_API_BASE_URL).
norecursedirs = ["e2e", "reports", ".*", "*.egg-info"]
