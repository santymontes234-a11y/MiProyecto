# EcoMove Querétaro — endurecimiento de OpenSSH. Instalar en /etc/ssh/sshd_config.d/
# (install_vps.sh lo copia SOLO si el usuario de despliegue ya tiene una clave en authorized_keys).
# Antes de cerrar tu sesión actual, abre OTRA terminal y comprueba que puedes entrar.

# Puerto: cambiarlo reduce ruido en los logs, no es una medida de seguridad real.
# Si lo cambias, abre el nuevo puerto en UFW ANTES de recargar sshd.
#Port 22

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
PermitTunnel no
# Solo el usuario de despliegue puede entrar por SSH (install_vps.sh sustituye el nombre).
AllowUsers __DEPLOY_USER__
