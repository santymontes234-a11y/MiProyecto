# Cabeceras de seguridad. La web (next.config.ts) y la API (SecurityMiddleware) ya envían su propia
# CSP y cabeceras; aquí se ocultan las del upstream y se reponen con "always" para que también
# las lleven las respuestas que genera Nginx (429, 502, 504...) y nunca salgan duplicadas.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
# HSTS: 2 años. Añade "; preload" solo cuando estés seguro de servir TODO el dominio por HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
