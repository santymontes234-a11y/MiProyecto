# Reverse proxy hacia los contenedores (escuchan solo en 127.0.0.1).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;   # se sobrescribe: el cliente no puede falsearlo
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $ecomove_connection_upgrade;
proxy_buffering on;
proxy_buffers 16 16k;
proxy_buffer_size 16k;
