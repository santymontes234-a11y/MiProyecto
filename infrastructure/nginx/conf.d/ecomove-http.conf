# EcoMove Querétaro — ajustes globales (contexto http). Instalar en /etc/nginx/conf.d/.
# Lo instala infrastructure/scripts/configure_nginx.sh.

server_tokens off;

# Tamaños y tiempos de espera globales (cada server/location puede afinarlos).
client_body_timeout   15s;
client_header_timeout 15s;
send_timeout          30s;
keepalive_timeout     30s;
client_max_body_size  1m;          # la API rechaza cuerpos > 1 MB (MAX_BODY_BYTES)
large_client_header_buffers 4 16k;
# Tiempos hacia los contenedores (un location puede ampliarlos, p. ej. /api/v1/admin/).
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# --- Protección básica contra abuso (por IP real del cliente) ---
# Peticiones por segundo. La API aplica además su propio límite de login (10/min por IP).
limit_req_zone  $binary_remote_addr zone=ecomove_web:10m      rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ecomove_api:10m      rate=15r/s;
limit_req_zone  $binary_remote_addr zone=ecomove_auth:10m     rate=20r/m;
limit_conn_zone $binary_remote_addr zone=ecomove_conn:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# WebSockets: el código actual NO los usa (API REST + Next sin sockets en producción).
# Este mapa queda listo por si en el futuro se añaden; los location lo usan sin efecto.
map $http_upgrade $ecomove_connection_upgrade {
    default upgrade;
    ''      close;
}

# Formato de log con tiempo de respuesta (útil para diagnosticar lentitud).
log_format ecomove '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'rt=$request_time urt=$upstream_response_time host=$host';
